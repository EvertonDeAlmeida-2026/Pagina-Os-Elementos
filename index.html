<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Os Elementos</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<main class="pagina">

    <!-- =====================================================
         CENÁRIO
         ===================================================== -->

    <div class="cenario">

		<!-- Cenário atual -->
		<div class="background background-atual"></div>

		<!-- Próximo cenário usado na transição -->
		<div class="background background-proximo"></div>

		<div class="overlay"></div>

		<div class="vignette"></div>

	</div>


    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header class="cabecalho">

        <div class="marca">
            JOGO OS ELEMENTOS
        </div>

        <div class="status">

            <span class="status-ponto"></span>

            EM DESENVOLVIMENTO

        </div>

    </header>


    <!-- =====================================================
         TÍTULO
         ===================================================== -->

    <section class="hero">

        <div class="subtitulo">
            UMA JORNADA DE EQUILÍBRIO
        </div>

        <h1>
            OS ELEMENTOS
        </h1>

        <div class="divisor">

            <span></span>

            <p>
                RESTAURE O EQUILÍBRIO
            </p>

            <span></span>

        </div>

    </section>


    <!-- =====================================================
         ESFERA
         ===================================================== -->

    <section class="esfera-container">
		<div class="particulas-terra"></div>
		<div class="particulas-agua"></div>
		<div class="particulas-ar"></div>
		<div class="particulas-fogo"></div>
		<div class="glow"></div>
		<img src="assets/images/esfera.png" alt="" class="esfera">
	</section>


    <!-- =====================================================
         ELEMENTOS
         ===================================================== -->

    <footer class="elementos">

        <button
            class="elemento"
            data-elemento="terra"
        >

            <img
                src="assets/icons/terra.png"
                alt="Terra"
            >

            <span>
                TERRA
            </span>

        </button>


        <button
            class="elemento"
            data-elemento="agua"
        >

            <img
                src="assets/icons/agua.png"
                alt="Água"
            >

            <span>
                ÁGUA
            </span>

        </button>


        <button
            class="elemento"
            data-elemento="ar"
        >

            <img
                src="assets/icons/ar.png"
                alt="Ar"
            >

            <span>
                AR
            </span>

        </button>


        <button
            class="elemento"
            data-elemento="fogo"
        >

            <img
                src="assets/icons/fogo.png"
                alt="Fogo"
            >

            <span>
                FOGO
            </span>

        </button>

    </footer>


</main>


<script src="js/script.js"></script>

</body>

</html>
